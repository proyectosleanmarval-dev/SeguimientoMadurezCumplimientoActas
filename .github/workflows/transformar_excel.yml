name: Transformar Excel Reuniones

on:
  push:
    paths:
      - "input/ProyectosBogota.xlsx"

jobs:

  procesar:

    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install pandas openpyxl

      - name: Ejecutar script
        run: |
          python script/procesar_reuniones.py

      # NUEVO PASO
      - name: Guardar resultado en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/resultado_reuniones.xlsx
          git commit -m "Actualizar resultado de reuniones"
          git push
