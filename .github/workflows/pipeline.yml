name: Procesar reuniones proyectos

on:
  push:
    paths:
      - "input/*.xlsx"

jobs:

  procesar:

    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install pandas openpyxl

      - name: Calcular calendario teorico
        run: |
          python scripts/calcular_teorico.py

      - name: Procesar reuniones reales
        run: |
          python scripts/procesar_reuniones.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/*.xlsx
          git diff --cached --quiet || git commit -m "Actualizar resultados reuniones"
          git push
