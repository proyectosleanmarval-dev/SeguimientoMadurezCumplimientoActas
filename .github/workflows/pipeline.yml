name: Procesar reuniones proyectos

on:
  push:
    paths:
      - "input/*.xlsx"

jobs:

  procesar:

    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install pandas openpyxl

      - name: Calcular calendario teorico
        run: |
          if [ -f input/ProyectosBogota.xlsx ]; then
            python scripts/calcular_teorico.py
          else
            echo "ProyectosBogota.xlsx no existe, se omite cálculo teórico"
          fi

      - name: Procesar reuniones reales
        run: |
          if [ -f input/Reuniones.xlsx ]; then
            python scripts/procesar_reuniones.py
          else
            echo "Reuniones.xlsx no existe, se omite procesamiento"
          fi

      - name: Guardar resultados en el repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/*.xlsx || true
          git diff --cached --quiet || git commit -m "Actualizar resultados reuniones"
          git push || true
